[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubber"
version = "0.1.0"
description = "Paste a YouTube link, get the video dubbed into Russian (plus subtitles and transcript)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp[default]>=2025.10.1",
    "deno>=2.0",  # JavaScript runtime yt-dlp needs for YouTube
    "faster-whisper>=1.1",
    "edge-tts>=7.0",
    "deep-translator>=1.11",
    "onnxruntime>=1.17",  # offline translator
    "tokenizers>=0.15",
    "huggingface_hub>=0.20",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.0"]

[project.scripts]
dubber = "dubber.cli:main"
dubber-app = "dubber.app:main"

[tool.setuptools.packages.find]
include = ["dubber*"]

[tool.setuptools.package-data]
dubber = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet + model downloads; run with DUBBER_NETWORK_TESTS=1"]
