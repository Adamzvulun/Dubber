[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubber"
version = "0.1.0"
description = "Paste a YouTube link, get the video dubbed into Russian (plus subtitles and transcript)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "edge-tts>=7.0",
    "deep-translator>=1.11",
    "numpy>=1.24",
    "gradio>=5.0",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6", "anthropic>=1.0"]

[project.scripts]
dubber = "dubber.cli:main"
dubber-app = "dubber.app:main"

[tool.setuptools.packages.find]
include = ["dubber*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
