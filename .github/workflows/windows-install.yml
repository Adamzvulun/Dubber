name: Windows install

# The one-click Windows start (Start Dubber.cmd -> scripts/windows/dubber.ps1) on a real Windows machine:
# components installed, desktop shortcut with the program's icon, program answering.
on:
  pull_request:
    paths:
      - "Start Dubber.cmd"
      - "scripts/**"
      - "dubber/assets/**"
      - "dubber/app.py"
      - "dubber/config.py"
      - "dubber/deps.py"
      - "dubber/phone.py"
      - "pyproject.toml"
      - ".github/workflows/windows-install.yml"
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install (Windows PowerShell 5.1, like a user's PC)
        shell: powershell
        run: |
          Remove-Item .git -Recurse -Force   # a user's folder is a ZIP, not a git checkout
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\dubber.ps1 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "dubber.ps1 failed: $LASTEXITCODE" }
          if (-not (Test-Path .venv\dubber-installed)) { throw "install stamp missing" }
          # the shortcut must really exist, not just a warning in the output
          # GitHub saves this step without a BOM, so PowerShell 5.1 would misread Cyrillic typed here
          $name = (-join [char[]](0x0414,0x0443,0x0431,0x043B,0x044F,0x0436,0x20,0x0432,0x0438,0x0434,0x0435,0x043E)) + '.lnk'
          if (-not (Test-Path -LiteralPath (Join-Path ([Environment]::GetFolderPath('Desktop')) $name))) { throw "no shortcut" }
          if (Test-Path install.log) { Get-Content install.log -Tail 5 }
          # a PC installed by an older version (no stamp yet) must not reinstall everything
          Remove-Item .venv\dubber-installed, install.log -ErrorAction SilentlyContinue
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\dubber.ps1 -NoStart
          if (-not (Test-Path .venv\dubber-installed)) { throw "existing install not recognised" }
          if (Test-Path install.log) { throw "reinstalled although the program was installed" }
      - name: Windows helpers compile in PowerShell 5.1 (font switch, shortcut)
        shell: powershell
        run: |
          $src = Get-Content scripts\windows\dubber.ps1 -Raw -Encoding UTF8
          $code = [regex]::Match($src, '(?s)\$NativeCode = @"\r?\n(.*?)\r?\n"@').Groups[1].Value
          if (-not $code) { throw "helper code not found" }
          Add-Type -TypeDefinition $code
          "font switched: $([DubberSetup.ConsoleFont]::UseCyrillicFont())  (False is expected here: CI has no console window)"
      - name: Desktop shortcut with the icon
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          $name = (-join [char[]](0x0414,0x0443,0x0431,0x043B,0x044F,0x0436,0x20,0x0432,0x0438,0x0434,0x0435,0x043E)) + '.lnk'
          $lnk = Get-ChildItem $desktop -Filter *.lnk | Where-Object { $_.Name -eq $name }
          if (-not $lnk) { Get-ChildItem $desktop; throw "shortcut not found" }
          # WScript.Shell can't open a Cyrillic path on this English Windows: read a copy with a plain name
          Copy-Item -LiteralPath $lnk.FullName "$env:TEMP\check.lnk" -Force
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:TEMP\check.lnk")
          "Target: $($s.TargetPath) $($s.Arguments)"; "Icon: $($s.IconLocation)"; "Dir: $($s.WorkingDirectory)"
          if ($s.IconLocation -notlike '*dubber\assets\dubber.ico,0') { throw "wrong icon" }
          $start = Join-Path ([Environment]::GetFolderPath('Programs')) $lnk.Name
          if (-not (Test-Path -LiteralPath $start)) { throw "Start menu shortcut missing" }
          if (-not (Test-Path ($s.IconLocation -replace ',0$', ''))) { throw "icon file missing" }
          if ($s.Arguments -notlike '*scripts\windows\dubber.ps1*') { throw "wrong target" }
      - name: Started without the launcher (like right after a self-update), the program makes the shortcut
        shell: powershell
        run: |
          $env:DUBBER_NO_BROWSER = '1'; $env:DUBBER_AUTO_UPDATE = '0'
          $name = (-join [char[]](0x0414,0x0443,0x0431,0x043B,0x044F,0x0436,0x20,0x0432,0x0438,0x0434,0x0435,0x043E)) + '.lnk'
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) $name
          Remove-Item -LiteralPath $lnk
          $p = Start-Process .venv\Scripts\python.exe -ArgumentList '-m', 'dubber.app' -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 60 -and -not (Test-Path -LiteralPath $lnk); $i++) { Start-Sleep 2 }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path -LiteralPath $lnk)) { throw "the program did not make the shortcut" }
          "shortcut made by the program"
      - name: The phone connection - cloudflared downloaded, tunnel up, refused without the household token
        shell: powershell
        run: |
          $env:DUBBER_NO_BROWSER = '1'; $env:DUBBER_AUTO_UPDATE = '0'
          $env:DUBBER_MAILBOX_URL = 'https://mailbox.invalid'   # no real mailbox: its calls fail harmlessly
          $p = Start-Process .venv\Scripts\python.exe -ArgumentList '-m', 'dubber.app' -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 90; $i++) {
            try { $s = Invoke-RestMethod http://127.0.0.1:7860/api/phone -TimeoutSec 2; if ($s.status -eq 'ready') { break } }
            catch {}
            Start-Sleep 2
          }
          "phone: $($s.status) $($s.address)"
          if (-not (Test-Path cloudflared\cloudflared.exe)) { throw "cloudflared was not downloaded" }
          if ($s.status -ne 'ready') { throw "the tunnel did not start" }
          $code = 0
          for ($i = 0; $i -lt 30; $i++) {   # a new tunnel address can take a few seconds to resolve
            try { Invoke-WebRequest "$($s.address)/api/version" -UseBasicParsing -TimeoutSec 10 | Out-Null; $code = 200 }
            catch { $code = [int]$_.Exception.Response.StatusCode }
            if ($code -eq 401 -or $code -eq 200) { break }
            Start-Sleep 3
          }
          if ($code -ne 401) { throw "through the tunnel without the token: $code (expected 401)" }
          $token = (Select-String -Path .env -Pattern '^DUBBER_PHONE_TOKEN=(.+)$').Matches[0].Groups[1].Value
          $v = Invoke-RestMethod "$($s.address)/api/version" -Headers @{ 'X-Dubber-Token' = $token } -TimeoutSec 10
          "through the tunnel with the token: $($v.version)"
          Stop-Process -Id $p.Id -Force
          Get-Process cloudflared -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Start Dubber.cmd starts the program
        shell: powershell
        run: |
          $env:DUBBER_NO_BROWSER = '1'
          $env:DUBBER_AUTO_UPDATE = '0'   # test this version, not whatever main has
          $p = Start-Process cmd -ArgumentList '/c', '"Start Dubber.cmd"' -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 90; $i++) {
            try { $v = Invoke-RestMethod http://127.0.0.1:7860/api/version -TimeoutSec 2; "Running: $($v.version)"; break }
            catch { Start-Sleep 2 }
          }
          if (-not $v) { throw "the program did not answer" }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*dubber.app*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

  # A PC like a fresh Windows 11: no winget yet, so Python, ffmpeg and the Microsoft C++ runtime are downloaded
  # directly (DUBBER_SETUP_TEST=1 makes the script skip winget and install all three even though this image has them),
  # in a folder with a Russian name. Then the components must load and Whisper must read its model from a folder with
  # a Russian name (a Russian user name puts the model cache there).
  clean-pc:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install without winget, in a folder with a Russian name
        shell: powershell
        env:
          DUBBER_SETUP_TEST: "1"
        run: |
          # GitHub saves this step without a BOM: Cyrillic built from char codes ("Дубляж")
          $dir = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x0414,0x0443,0x0431,0x043B,0x044F,0x0436)) + ' test')
          New-Item -ItemType Directory $dir | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Copy-Item -Destination $dir -Recurse
          Set-Location -LiteralPath $dir
          # A program folder from a failed earlier install, made with the newest Python here ("py -3": 3.15 on this
          # image in October 2026, which onnxruntime has no build for): it must be rebuilt with a supported one
          py -0p
          py -3 -m venv .venv
          .venv\Scripts\python.exe -c "import sys; print('old venv:', sys.version)"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\dubber.ps1 -NoStart
          $code = $LASTEXITCODE
          if (Test-Path install.log) { Get-Content install.log -Tail 15 }
          if ($code -ne 0) { throw "dubber.ps1 failed: $code" }
          if (-not (Test-Path ffmpeg\bin\ffmpeg.exe)) { throw "ffmpeg was not downloaded into the program folder" }
          .venv\Scripts\python.exe -m dubber.deps
          if ($LASTEXITCODE -ne 0) { throw "components missing or not loading" }
          .venv\Scripts\python.exe -c "import sys; print(sys.version); assert (3, 10) <= sys.version_info[:2] <= (3, 14)"
          if ($LASTEXITCODE -ne 0) { throw "the program's Python is not a supported version" }
          # curl-cffi (yt-dlp looks like a browser): TikTok and Instagram refuse downloads without a login otherwise
          $targets = .venv\Scripts\python.exe -m yt_dlp --list-impersonate-targets 2>&1 | Out-String
          $targets
          if ($targets -notmatch 'curl_cffi') { throw "yt-dlp has no browser impersonation (curl-cffi missing)" }
      - name: Whisper reads its model from a folder with a Russian name; ffmpeg found without PATH
        shell: powershell
        run: |
          $name = -join [char[]](0x0414,0x0443,0x0431,0x043B,0x044F,0x0436)
          Set-Location -LiteralPath (Join-Path $env:RUNNER_TEMP "$name test")
          $env:HF_HOME = Join-Path $env:RUNNER_TEMP "$name models"
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'ffmpeg' }) -join ';'
          .venv\Scripts\python.exe -c "import numpy as np; from dubber import config, media; media.require_ffmpeg(); from faster_whisper import WhisperModel; m = WhisperModel('tiny', device='cpu', compute_type='int8'); segs, info = m.transcribe(np.zeros(32000, dtype=np.float32)); list(segs); print('whisper ok', info.language)"
          if ($LASTEXITCODE -ne 0) { throw "Whisper or ffmpeg failed" }
      - name: A second start installs nothing and repairs a removed component
        shell: powershell
        run: |
          $name = -join [char[]](0x0414,0x0443,0x0431,0x043B,0x044F,0x0436)
          Set-Location -LiteralPath (Join-Path $env:RUNNER_TEMP "$name test")
          .venv\Scripts\python.exe -m pip uninstall -y edge-tts
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\dubber.ps1 -NoStart
          if ($LASTEXITCODE -ne 0) { throw "dubber.ps1 failed: $LASTEXITCODE" }
          .venv\Scripts\python.exe -m dubber.deps
          if ($LASTEXITCODE -ne 0) { throw "the removed component was not reinstalled" }
