name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Dubber
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline)
        run: pytest -q
      - name: Phone mailbox worker tests (Node)
        run: node --test cloud/worker/worker.test.mjs
